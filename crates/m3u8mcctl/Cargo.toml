[package]
name = "m3u8mcctl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m3u8mcctl"
path = "src/main.rs"

[dependencies]
m3u8mc-common = { path = "../common" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "1"
thiserror = "1"
url = "=2.4.1"
tracing = "0.1"
