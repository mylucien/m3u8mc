[package]
name = "m3u8mcd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m3u8mcd"
path = "src/main.rs"

[dependencies]
m3u8mc-common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
axum = "0.7"
async-stream = "0.3"
bytes = "1"
dashmap = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "=4.4.18", features = ["derive"] }
thiserror = "1"
futures = "0.3"
rand = "0.8"
anyhow = "1"
url = "=2.4.1"
indexmap = "=2.2.6"
