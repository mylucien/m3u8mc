name: Build FFmpeg for OpenWrt (Static with GPL)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FFMPEG_VERSION: 8.0.1

jobs:
  build:
    runs-on: ubuntu-24.04  # 改用 24.04，包更全
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        
        # 安装基础依赖
        sudo apt-get install -y \
          build-essential \
          yasm \
          nasm \
          pkg-config \
          cmake \
          git \
          wget \
          autoconf \
          automake \
          libtool \
          zlib1g-dev \
          libssl-dev \
          libx11-dev \
          libxext-dev \
          libxfixes-dev \
          libxcb1-dev \
          libxcb-shm0-dev \
          libxcb-xfixes0-dev \
          libxcb-shape0-dev \
          libdrm-dev \
          libva-dev \
          libvdpau-dev \
          libasound2-dev \
          libpulse-dev \
          libv4l-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libglvnd-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libass-dev \
          libfribidi-dev \
          libharfbuzz-dev \
          libtheora-dev \
          libvorbis-dev \
          libogg-dev \
          libvpx-dev \
          libwebp-dev \
          libx264-dev \
          libx265-dev \
          libxvidcore-dev \
          libmp3lame-dev \
          libopus-dev \
          libxml2-dev \
          libbluray-dev \
          libbz2-dev \
          libssh-dev \
          libzmq3-dev \
          libsoxr-dev \
          libaom-dev \
          libdav1d-dev \
          libsvtav1-dev \
          libopenmpt-dev \
          libvidstab-dev \
          libvpl-dev \
          lv2-dev \
          liblilv-dev \
          libgsm1-dev \
          libopencore-amrnb-dev \
          libopencore-amrwb-dev \
          libvo-amrwbenc-dev \
          libtwolame-dev \
          libcaca-dev \
          libcdio-dev \
          libcdio-paranoia-dev \
          libchromaprint-dev \
          libcodec2-dev \
          libjack-jackd2-dev \
          libmodplug-dev \
          libopenjp2-7-dev \
          librubberband-dev \
          libsdl2-dev \
          libshine-dev \
          libsnappy-dev \
          libspeex-dev \
          libtesseract-dev \
          libwavpack-dev \
          libzbar-dev \
          libzvbi-dev \
          libgme-dev \
          libsodium-dev \
          libxdmcp-dev \
          libxau-dev \
          libbsd-dev

    - name: Build missing dependencies (rav1e, jxl, shaderc)
      run: |
        # rav1e - 从源码编译
        cd /tmp
        git clone --depth 1 https://github.com/xiph/rav1e.git
        cd rav1e
        cargo build --release --features=asm
        sudo cp target/release/librav1e.a /usr/lib/x86_64-linux-gnu/
        sudo cp target/release/librav1e.so /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
        sudo cp include/rav1e/* /usr/include/ 2>/dev/null || true
        
        # libjxl - 从源码编译
        cd /tmp
        git clone --depth 1 https://github.com/libjxl/libjxl.git
        cd libjxl
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=OFF
        make -j$(nproc)
        sudo make install
        
        # shaderc - 从源码编译 (需要先编译 glslang)
        cd /tmp
        git clone --depth 1 https://github.com/KhronosGroup/glslang.git
        cd glslang
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=OFF
        make -j$(nproc)
        sudo make install
        
        cd /tmp
        git clone --depth 1 https://github.com/google/shaderc.git
        cd shaderc
        ./utils/git-sync-deps
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DSHADERC_SKIP_TESTS=ON -DBUILD_SHARED_LIBS=OFF
        make -j$(nproc)
        sudo make install

    - name: Build FFmpeg (Static with full GPL support)
      run: |
        cd /tmp
        wget -q https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz
        tar -xf ffmpeg-${FFMPEG_VERSION}.tar.xz
        cd ffmpeg-${FFMPEG_VERSION}
        
        export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
        
        ./configure \
          --prefix=/usr \
          --disable-librtmp \
          --disable-lzma \
          --disable-stripping \
          --enable-static \
          --disable-shared \
          --enable-avfilter \
          --enable-gpl \
          --enable-ladspa \
          --enable-libaom \
          --enable-libass \
          --enable-libbluray \
          --enable-libdav1d \
          --enable-libdrm \
          --enable-libfontconfig \
          --enable-libfreetype \
          --enable-libfribidi \
          --enable-libharfbuzz \
          --enable-libmp3lame \
          --enable-libopenmpt \
          --enable-libopus \
          --enable-libpulse \
          --enable-libsoxr \
          --enable-libssh \
          --enable-libtheora \
          --enable-libv4l2 \
          --enable-libvidstab \
          --enable-libvorbis \
          --enable-libvpx \
          --enable-libwebp \
          --enable-libx264 \
          --enable-libx265 \
          --enable-libxcb \
          --enable-libxml2 \
          --enable-libxvid \
          --enable-libzimg \
          --enable-libzmq \
          --enable-lto=auto \
          --enable-lv2 \
          --enable-openssl \
          --enable-pic \
          --enable-pthreads \
          --enable-vaapi \
          --enable-vdpau \
          --enable-version3 \
          --enable-vulkan \
          --optflags=-O3 \
          --enable-libsvtav1 \
          --enable-libvpl \
          --enable-librav1e \
          --enable-libjxl \
          --enable-libshaderc \
          --enable-libplacebo \
          --enable-libsrt \
          --enable-librist \
          --extra-ldflags="-static -static-libgcc -static-libstdc++" \
          --extra-cflags="-static -O3" \
          --pkg-config-flags="--static" || true  # 如果失败，继续用简化版
        
        # 如果上面的配置失败，使用简化版本（包含 GPL 但不包含难装的库）
        if [ ! -f ffmpeg ]; then
          echo "=== Full config failed, trying simplified version ==="
          make distclean
          
          ./configure \
            --prefix=/usr \
            --disable-librtmp \
            --disable-lzma \
            --disable-stripping \
            --enable-static \
            --disable-shared \
            --enable-avfilter \
            --enable-gpl \
            --enable-version3 \
            --enable-pic \
            --enable-pthreads \
            --enable-openssl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libaom \
            --enable-libdav1d \
            --enable-libass \
            --enable-libfreetype \
            --enable-libfontconfig \
            --enable-libvorbis \
            --enable-libtheora \
            --enable-libwebp \
            --enable-libxvid \
            --enable-vaapi \
            --enable-vdpau \
            --enable-libsoxr \
            --enable-libssh \
            --enable-libxml2 \
            --enable-libbluray \
            --enable-libsvtav1 \
            --enable-libvpl \
            --extra-ldflags="-static"
        fi
        
        make -j$(nproc)
        
        # 验证 GPL 功能
        echo "=== Checking GPL features ==="
        ./ffmpeg -bsfs | grep h264_mp4toannexb && echo "✅ h264_mp4toannexb available" || echo "⚠️ Missing h264_mp4toannexb"
        ./ffmpeg -encoders | grep libx264 && echo "✅ libx264 available" || echo "⚠️ Missing libx264"
        ./ffmpeg -version
        
        mkdir -p $GITHUB_WORKSPACE/artifacts
        cp ./ffmpeg $GITHUB_WORKSPACE/artifacts/
        cp ./ffprobe $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
        
        file $GITHUB_WORKSPACE/artifacts/ffmpeg
        ls -lh $GITHUB_WORKSPACE/artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-openwrt-static-x86_64
        path: |
          ${{ github.workspace }}/artifacts/ffmpeg
          ${{ github.workspace }}/artifacts/ffprobe
