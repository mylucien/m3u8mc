# GitHub Actions：交叉编译 m3u8mcd / m3u8mcctl，发布 Release，推送 Docker 镜像
#
# 触发规则：
#   push / PR → master   : 编译全部架构，验证通过即可，不发布
#   push tag  v*         : 编译全部架构 → 并行发布 Release + 构建推送 Docker 镜像
#
# Job 结构：
#   build (matrix per target)
#     ├── release  (仅 tag，直接消费 build 产物)
#     └── docker   (仅 tag，直接消费 build 产物)

name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ── 交叉编译各架构二进制 ─────────────────────────────────────
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - i686-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: |
          pip install ziglang
          cargo install cargo-zigbuild

      - name: Build
        run: |
          cargo zigbuild \
            --target "${{ matrix.target }}" \
            --profile release \
            -p m3u8mcd \
            -p m3u8mcctl

      - name: Collect binaries
        run: |
          OUT="bin/${{ matrix.target }}"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/m3u8mcd"   "$OUT/m3u8mcd"
          cp "target/${{ matrix.target }}/release/m3u8mcctl"  "$OUT/m3u8mcctl"
          strip "$OUT/m3u8mcd" "$OUT/m3u8mcctl" 2>/dev/null || true
          ls -lh "$OUT/"
          file "$OUT/"*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bin/${{ matrix.target }}/
          if-no-files-found: error

  # ── 发布 Release（仅 tag 触发） ───────────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifacts

      - name: Package tarballs
        run: |
          for dir in download-artifacts/bin-*/; do
            triple="${dir#download-artifacts/bin-}"
            triple="${triple%/}"
            tarball="m3u8mc-${triple}.tar.gz"
            tar czf "$tarball" -C download-artifacts "bin-${triple}"
            echo "Packaged: $tarball $(du -sh $tarball | cut -f1)"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: m3u8mc ${{ github.ref_name }}
          body: |
            预编译二进制包，配合 OpenWrt `openwrt-package/Makefile` 使用。

            **支持的架构：**

            | 架构 | Rust triple | 适用设备 |
            |---|---|---|
            | x86_64 | `x86_64-unknown-linux-musl` | x86 软路由 |
            | aarch64 | `aarch64-unknown-linux-musl` | IPQ807x / RK35xx |
            | armv7l | `armv7-unknown-linux-musleabihf` | 多数 ARM 路由器 |
            | i686 | `i686-unknown-linux-musl` | 旧 x86 设备 |

            **用法：**
            ```bash
            tar xzf m3u8mc-x86_64-unknown-linux-musl.tar.gz
            RUST_TARGET_TRIPLE=x86_64-unknown-linux-musl make package/m3u8mc/compile V=s
            ```

            Docker 镜像：`ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
          files: m3u8mc-*.tar.gz
          draft: false
          prerelease: false

  # ── 构建并推送多架构 Docker 镜像（仅 tag 触发） ────────────────
  docker:
    name: Build & push Docker image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifacts

      - name: Assemble bin/ tree for Docker context
        run: |
          mkdir -p bin
          for dir in download-artifacts/bin-*/; do
            triple="${dir#download-artifacts/bin-}"
            triple="${triple%/}"
            mkdir -p "bin/${triple}"
            cp -r "$dir"/* "bin/${triple}/"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
