# 检验插件：验证 openwrt-package Makefile 和 Rust 源码
#
# 每次 push / PR 自动运行（immortalwrt SDK 编译验证）：
#   1. 检查 Makefile 格式（无注释在 define 块内等）
#   2. 检查必要文件齐全
#   3. 运行 Rust 单元测试
#   4. 验证预编译二进制存在且是合法 ELF

name: check

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --verbose

  validate-makefile:
    name: Validate Makefiles & package structure
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for comments inside define blocks
        run: |
          errors=0
          for mf in openwrt-package/m3u8mc/Makefile openwrt-package/luci-app-m3u8mc/Makefile; do
            echo "Checking $mf..."
            in_block=""
            while IFS= read -r line; do
              if echo "$line" | grep -q "^define "; then
                in_block="yes"
                continue
              fi
              if echo "$line" | grep -q "^endef"; then
                in_block=""
                continue
              fi
              if [ -n "$in_block" ] && echo "$line" | grep -qE "^\s+#"; then
                echo "::error file=$mf::Comment found inside define block: $line"
                errors=$((errors + 1))
              fi
            done < "$mf"
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors comment(s) inside define blocks"
            exit 1
          fi
          echo "No comments inside define blocks"

      - name: Verify required fields in Makefiles
        run: |
          for mf in openwrt-package/m3u8mc/Makefile openwrt-package/luci-app-m3u8mc/Makefile; do
            echo "=== $mf ==="
            for field in SECTION CATEGORY TITLE; do
              if grep -q "^\s*${field}:=" "$mf"; then
                echo "  $field OK"
              else
                echo "::error file=$mf::$field is missing"
                exit 1
              fi
            done
            # DEPENDS is optional for luci packages (but should exist)
            if grep -q "^\s*DEPENDS:=" "$mf"; then
              deps=$(grep "^\s*DEPENDS:=" "$mf" | sed 's/.*DEPENDS:=//')
              if echo "$deps" | grep -q "libxz"; then
                echo "::error file=$mf::DEPENDS contains libxz - use liblzma instead"
                exit 1
              fi
              echo "  DEPENDS=$deps OK"
            fi
            if grep -q "^\s*SUBMENU:=" "$mf"; then
              echo "  SUBMENU set"
            else
              echo "  SUBMENU missing (warning)"
            fi
          done

      - name: Verify required files exist
        run: |
          missing=0
          required_m3u8mc=(
            "openwrt-package/m3u8mc/files/m3u8mc.init"
            "openwrt-package/m3u8mc/files/m3u8mc.config"
            "openwrt-package/m3u8mc/files/ffmpeg-install.sh"
          )
          for f in "${required_m3u8mc[@]}"; do
            if [ -f "$f" ]; then echo "$f"; else echo "::error file=$f::missing"; missing=$((missing+1)); fi
          done
          required_luci=(
            "openwrt-package/luci-app-m3u8mc/luci/controller/m3u8mc.lua"
            "openwrt-package/luci-app-m3u8mc/luci/model/cbi/m3u8mc/channels.lua"
            "openwrt-package/luci-app-m3u8mc/luci/model/cbi/m3u8mc/isolation.lua"
            "openwrt-package/luci-app-m3u8mc/luci/view/m3u8mc/status.htm"
            "openwrt-package/luci-app-m3u8mc/luci/view/m3u8mc/ffmpeg.htm"
            "openwrt-package/luci-app-m3u8mc/luci/htdocs/m3u8mc-status.js"
          )
          for f in "${required_luci[@]}"; do
            if [ -f "$f" ]; then echo "$f"; else echo "::error file=$f::missing"; missing=$((missing+1)); fi
          done
          if [ "$missing" -gt 0 ]; then echo "$missing file(s) missing"; exit 1; fi
          echo "All required files present"

  validate-binaries:
    name: Check prebuilt binaries
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: openwrt-package/m3u8mc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify prebuilt binaries are valid ELF files
        run: |
          failures=0
          for triple_dir in bin/*/; do
            triple=$(basename "$triple_dir")
            for bin in m3u8mcd m3u8mcctl; do
              path="${triple_dir}${bin}"
              if [ ! -f "$path" ]; then
                echo "::warning::Missing $bin for $triple"
                continue
              fi
              size=$(stat -c%s "$path")
              if ! file "$path" | grep -q "ELF"; then
                echo "::error file=$path::$bin for $triple is not a valid ELF binary"
                failures=$((failures + 1))
              elif [ "$size" -lt 100000 ]; then
                echo "::warning file=$path::$bin for $triple is suspiciously small (${size} bytes)"
              else
                echo "✅ $triple/$bin: ELF verified, ${size} bytes"
              fi
            done
          done
          if [ "$failures" -gt 0 ]; then
            echo "❌ $failures binary verification(s) failed"
            exit 1
          fi
          echo "✅ All prebuilt binaries are valid"

  openwrt-build:
    name: ImmortalWrt compile (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (m3u8mc)
        uses: actions/checkout@v4
        with:
          path: m3u8mc

      - name: Restore ImmortalWrt SDK from cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /tmp/immortalwrt-sdk
          key: immortalwrt-sdk-23.05.4-x86_64

      - name: Download & extract SDK (cache miss only)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/23.05.4/targets/x86/64/immortalwrt-sdk-23.05.4-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          echo "Downloading SDK (370MB, first time only, may take a few minutes)..."
          curl -fsSL --connect-timeout 60 --max-time 600 \
            -o /tmp/sdk.tar.xz "$SDK_URL"
          echo "Extracting..."
          tar -xJf /tmp/sdk.tar.xz -C /tmp
          mv /tmp/immortalwrt-sdk-* /tmp/immortalwrt-sdk
          echo "SDK ready at /tmp/immortalwrt-sdk"

      - name: Link packages and compile
        run: |
          SDK_DIR=/tmp/immortalwrt-sdk
          export TERM=linux
          # 分别 link 两个独立包
          ln -s "${{ github.workspace }}/m3u8mc/openwrt-package/m3u8mc" \
            "$SDK_DIR/package/m3u8mc"
          ln -s "${{ github.workspace }}/m3u8mc/openwrt-package/luci-app-m3u8mc" \
            "$SDK_DIR/package/luci-app-m3u8mc"
          ls -la "$SDK_DIR/package/m3u8mc/Makefile"
          ls -la "$SDK_DIR/package/luci-app-m3u8mc/Makefile"

          cd "$SDK_DIR"
          export TERM=linux
          make defconfig 2>&1
          echo "Config ready"

          # 编译 m3u8mc
          RUST_TARGET_TRIPLE=x86_64-unknown-linux-musl \
            make package/m3u8mc/compile V=s 2>&1 || {
            echo "m3u8mc compilation failed"
            exit 1
          }
          echo "m3u8mc compiled"

          # 编译 luci-app-m3u8mc（纯文件复制，秒级）
          make package/luci-app-m3u8mc/compile V=s 2>&1 || {
            echo "luci-app-m3u8mc compilation failed"
            exit 1
          }
          echo "luci-app-m3u8mc compiled"
          IPK_LIST=$(find "$SDK_DIR/bin" -name "*m3u8mc*.ipk" 2>/dev/null)
          echo "$IPK_LIST"
          for ipk in $IPK_LIST; do
            cp "$ipk" "${{ github.workspace }}/"
            echo "✅ $(basename $ipk)"
          done

      - name: Upload ipk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8mc-ipk-x86_64
          path: "*.ipk"
          if-no-files-found: ignore
