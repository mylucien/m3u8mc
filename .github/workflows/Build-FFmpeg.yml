name: Build Static FFmpeg

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version (e.g. 8.0.1)'
        required: true
        default: '8.0.1'

jobs:
  # ── 方案一：直接从 wader/static-ffmpeg 镜像提取（推荐，5 分钟内完成）────────
  extract:
    name: Extract from static-ffmpeg image
    runs-on: ubuntu-latest
    steps:
      - name: Pull and extract static ffmpeg binary
        run: |
          VERSION="${{ github.event.inputs.ffmpeg_version }}"
          docker pull "mwader/static-ffmpeg:${VERSION}"
          # 从镜像里把二进制复制出来
          docker create --name ffmpeg_tmp "mwader/static-ffmpeg:${VERSION}"
          docker cp ffmpeg_tmp:/ffmpeg  ./ffmpeg
          docker cp ffmpeg_tmp:/ffprobe ./ffprobe
          docker rm ffmpeg_tmp

      - name: Verify
        run: |
          echo "=== file type ==="
          file ffmpeg ffprobe
          echo "=== size ==="
          ls -lh ffmpeg ffprobe
          echo "=== ldd (must be 'statically linked') ==="
          ldd ffmpeg || true
          echo "=== version ==="
          ./ffmpeg -version
          echo "=== buildconf ==="
          ./ffmpeg -buildconf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static-musl-x86_64-${{ github.event.inputs.ffmpeg_version }}
          path: |
            ffmpeg
            ffprobe
          retention-days: 90
