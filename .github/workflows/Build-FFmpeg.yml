name: Build FFmpeg Static (Ubuntu)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FFMPEG_VERSION: 8.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          yasm \
          nasm \
          pkg-config \
          cmake \
          git \
          wget \
          autoconf \
          automake \
          libtool \
          zlib1g-dev \
          libssl-dev \
          libx11-dev \
          libxext-dev \
          libxfixes-dev \
          libxcb1-dev \
          libxcb-shm0-dev \
          libxcb-xfixes0-dev \
          libxcb-shape0-dev \
          libdrm-dev \
          libva-dev \
          libvdpau-dev \
          libasound2-dev \
          libpulse-dev \
          libv4l-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libglvnd-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libass-dev \
          libfribidi-dev \
          libharfbuzz-dev \
          libtheora-dev \
          libvorbis-dev \
          libogg-dev \
          libvpx-dev \
          libwebp-dev \
          libx264-dev \
          libx265-dev \
          libxvidcore-dev \
          libmp3lame-dev \
          libopus-dev \
          libxml2-dev \
          libbluray-dev \
          libbz2-dev \
          libssh-dev \
          libsrt-dev \
          librist-dev \
          libzmq3-dev \
          libsoxr-dev \
          libaom-dev \
          libdav1d-dev \
          libsvtav1-dev \
          librav1e-dev \
          libjxl-dev \
          libplacebo-dev \
          libshaderc-dev \
          libopenmpt-dev \
          libvidstab-dev \
          libzimg-dev \
          libvpl-dev \
          lv2-dev \
          liblilv-dev

    - name: Download and build FFmpeg
      run: |
        cd /tmp
        wget -q https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz
        tar -xf ffmpeg-${FFMPEG_VERSION}.tar.xz
        cd ffmpeg-${FFMPEG_VERSION}
        
        # 与容器内完全一致的配置
        ./configure \
          --prefix=/usr \
          --disable-librtmp \
          --disable-lzma \
          --disable-stripping \
          --enable-static \
          --disable-shared \
          --enable-avfilter \
          --enable-gpl \
          --enable-ladspa \
          --enable-libaom \
          --enable-libass \
          --enable-libbluray \
          --enable-libdav1d \
          --enable-libdrm \
          --enable-libfontconfig \
          --enable-libfreetype \
          --enable-libfribidi \
          --enable-libharfbuzz \
          --enable-libjxl \
          --enable-libmp3lame \
          --enable-libopenmpt \
          --enable-libopus \
          --enable-libplacebo \
          --enable-libpulse \
          --enable-librav1e \
          --enable-librist \
          --enable-libshaderc \
          --enable-libsoxr \
          --enable-libsrt \
          --enable-libssh \
          --enable-libtheora \
          --enable-libv4l2 \
          --enable-libvidstab \
          --enable-libvorbis \
          --enable-libvpx \
          --enable-libwebp \
          --enable-libx264 \
          --enable-libx265 \
          --enable-libxcb \
          --enable-libxml2 \
          --enable-libxvid \
          --enable-libzimg \
          --enable-libzmq \
          --enable-lto=auto \
          --enable-lv2 \
          --enable-openssl \
          --enable-pic \
          --enable-pthreads \
          --enable-vaapi \
          --enable-vdpau \
          --enable-version3 \
          --enable-vulkan \
          --optflags=-O3 \
          --enable-libsvtav1 \
          --enable-libvpl \
          --extra-ldflags="-static -static-libgcc -static-libstdc++" \
          --extra-cflags="-static"
        
        make -j$(nproc)
        
        mkdir -p $GITHUB_WORKSPACE/artifacts
        cp ./ffmpeg $GITHUB_WORKSPACE/artifacts/
        cp ./ffprobe $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-static-x86_64
        path: artifacts/
