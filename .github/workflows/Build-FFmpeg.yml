name: Build FFmpeg Static (Same as Container)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发

env:
  FFMPEG_VERSION: 8.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build FFmpeg Static
      run: |
        # 创建编译目录
        mkdir -p $HOME/ffmpeg-build
        cd $HOME/ffmpeg-build
        
        # 安装编译依赖（Alpine 风格）
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          yasm \
          nasm \
          pkg-config \
          libaom-dev \
          libass-dev \
          libbluray-dev \
          libdav1d-dev \
          libdrm-dev \
          libfontconfig-dev \
          libfreetype-dev \
          libfribidi-dev \
          libharfbuzz-dev \
          libjxl-dev \
          libmp3lame-dev \
          libopenmpt-dev \
          libopus-dev \
          libplacebo-dev \
          libpulse-dev \
          librav1e-dev \
          librist-dev \
          libshaderc-dev \
          libsoxr-dev \
          libsrt-dev \
          libssh-dev \
          libtheora-dev \
          libv4l-dev \
          libvidstab-dev \
          libvorbis-dev \
          libvpx-dev \
          libwebp-dev \
          libx264-dev \
          libx265-dev \
          libxcb-shm0-dev \
          libxcb-xfixes0-dev \
          libxml2-dev \
          libxvidcore-dev \
          libzimg-dev \
          libzmq3-dev \
          liblilv-dev \
          libssl-dev \
          libvulkan-dev \
          libsvtav1enc-dev \
          libvpl-dev \
          libva-dev \
          libvdpau-dev \
          libasound2-dev \
          libx11-dev \
          libxext-dev \
          libxfixes-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libdrm-dev \
          libgl-dev \
          libegl-dev
        
        # 下载 FFmpeg 源码
        wget -q https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz
        tar -xf ffmpeg-${FFMPEG_VERSION}.tar.xz
        cd ffmpeg-${FFMPEG_VERSION}
        
        # 配置（与容器内完全一致，改为静态）
        ./configure \
          --prefix=/usr \
          --disable-librtmp \
          --disable-lzma \
          --disable-stripping \
          --enable-static \
          --disable-shared \
          --enable-avfilter \
          --enable-gpl \
          --enable-ladspa \
          --enable-libaom \
          --enable-libass \
          --enable-libbluray \
          --enable-libdav1d \
          --enable-libdrm \
          --enable-libfontconfig \
          --enable-libfreetype \
          --enable-libfribidi \
          --enable-libharfbuzz \
          --enable-libjxl \
          --enable-libmp3lame \
          --enable-libopenmpt \
          --enable-libopus \
          --enable-libplacebo \
          --enable-libpulse \
          --enable-librav1e \
          --enable-librist \
          --enable-libshaderc \
          --enable-libsoxr \
          --enable-libsrt \
          --enable-libssh \
          --enable-libtheora \
          --enable-libv4l2 \
          --enable-libvidstab \
          --enable-libvorbis \
          --enable-libvpx \
          --enable-libwebp \
          --enable-libx264 \
          --enable-libx265 \
          --enable-libxcb \
          --enable-libxml2 \
          --enable-libxvid \
          --enable-libzimg \
          --enable-libzmq \
          --enable-lto=auto \
          --enable-lv2 \
          --enable-openssl \
          --enable-pic \
          --enable-pthreads \
          --enable-vaapi \
          --enable-vdpau \
          --enable-version3 \
          --enable-vulkan \
          --optflags=-O3 \
          --enable-libsvtav1 \
          --enable-libvpl \
          --extra-ldflags="-static -static-libgcc -static-libstdc++" \
          --extra-cflags="-static"
        
        # 编译
        make -j$(nproc)
        
        # 检查产物
        ls -lh ./ffmpeg
        file ./ffmpeg
        
        # 复制到输出目录
        mkdir -p $GITHUB_WORKSPACE/artifacts
        cp ./ffmpeg $GITHUB_WORKSPACE/artifacts/ffmpeg-static
        cp ./ffprobe $GITHUB_WORKSPACE/artifacts/ffprobe-static 2>/dev/null || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-static-x86_64
        path: |
          ${{ github.workspace }}/artifacts/ffmpeg-static
          ${{ github.workspace }}/artifacts/ffprobe-static
        compression-level: 0

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ github.workspace }}/artifacts/ffmpeg-static
          ${{ github.workspace }}/artifacts/ffprobe-static
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
